# LiveKit Server 本地开发测试配置文件
# 适用于 macOS / Linux 本地开发环境

port: 7880
bind_addresses:
  - "0.0.0.0"

# 鉴权密钥 (需保持 >= 32 字符安全长度)
keys:
  devkey: "secret_livekit_key_for_development_32chars_ok"

# 媒体配置
rtc:
  # 单端口 UDP (RFC 7983 分流)，避免开放大段动态 UDP 端口
  udp_port: 7882
  tcp_port: 7881
  use_external_ip: false

logging:
  level: info
